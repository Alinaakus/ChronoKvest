# Конфигурация Amvera Cloud для ХроноКвеста.
# Это статический сайт (HTML/CSS/JS), без бэкенда и базы данных —
# весь прогресс хранится в браузере пользователя (localStorage).
# Поэтому используем окружение docker: собираем образ по Dockerfile,
# который раздаёт файлы из app/ через nginx.
meta:
  environment: docker
  toolchain:
    name: docker

run:
  # Порт, который слушает наш сайт внутри контейнера (nginx = 80).
  containerPort: 80
